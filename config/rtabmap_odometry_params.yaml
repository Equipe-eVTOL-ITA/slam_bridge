rgbd_odometry:
  ros__parameters:
    # Base frame of the camera (x-forward FLU). camera.launch.py passes
    # base_frame:=<camera name>, so the driver's URDF base link is 'oak'.
    # Do NOT use the optical frame here: the optical frame is
    # z-forward/y-down, which breaks the ENU/FLU assumptions the
    # slam_bridge ENU->NED conversion relies on.
    frame_id: 'oak'
    approx_sync: true
    approx_sync_max_interval: 0.034  # ~half a frame period at 15 fps (rgb+depth are hw-synced anyway)
    qos_image: 1
    qos_camera_info: 1

    # --- Prevent old frames from waiting in line ---
    queue_size: 10
    sync_queue_size: 10

    # --- COMPUTE SPEED OPTIMIZATIONS (Saves CPU cycles per frame) ---
    Odom/ResetCountdown: '5'
    Odom/ImageDecimation: '2'      # Extract features at half resolution (big Jetson win)
    Vis/MinInliers: '10'
    Vis/MaxFeatures: '400'
    Odom/Strategy: '0'             # 0 = Frame-to-Map (Best for localization tracking)
    always_check_imu_tf: false

    # Limit visual match search loops:
    Vis/EstimationType: '1'        # 1 = PnP (Fastest transformation calculation method)
    Vis/CorFlowWinSize: '11'       # Smaller search window size for faster execution

    # Wait for a filtered IMU orientation before starting, so the odometry
    # is initialized aligned with gravity (required for GravitySigma).
    wait_imu_to_init: true
