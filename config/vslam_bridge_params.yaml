# Host-side nodes for the cuVSLAM pipeline: slam_bridge + rect_camera_info_fixer.
# Loaded by launch/vslam.launch.py.

/slam_bridge:
  ros__parameters:
    slam_odometry_topic: '/visual_slam/tracking/odometry'
    px4_odometry_output_topic: '/fmu/in/vehicle_visual_odometry'
    timesync_topic: '/fmu/out/timesync_status'

    # cuVSLAM's real per-frame covariance. Its nav_msgs/Odometry covariance is
    # all zeros; the actual estimate goes out on this separate topic, matched
    # to the odometry by header stamp (measured stamp delta: 0 us).
    # Set to '' to disable and fall back to the odometry message covariance —
    # which is what the RTAB-Map backend wants, since rtabmap fills that in.
    covariance_topic: '/visual_slam/tracking/vo_pose_covariance'
    # How far off an odometry stamp a covariance sample may be before it is
    # considered stale and the fallback is used. 3 frames at 30 Hz.
    covariance_max_age_ms: 100

    # Minimum stddev (m / m·s⁻¹ / rad) forced onto every published covariance,
    # applied AFTER the real covariance above — it is a lower bound, not a
    # replacement. Measured real position stddev is p50 [0.078, 0.113, 0.161] m,
    # so this 0.1 floor still binds on x but lets y/z report honestly, and lets
    # the tracking-wobble spikes (up to σ = 1.67 m) through to EKF2's gate.
    variance_floor: 0.1

    # Camera position relative to the FLIGHT CONTROLLER, body FLU metres
    # (x forward, y left, z up). Measured: 15 cm forward.
    # Keep EKF2_EV_POS_X/Y/Z at 0 — PX4 applies its own lever arm from those
    # params and setting both double-counts.
    camera_offset_body: [0.15, 0.0, 0.0]

/rect_camera_info_fixer:
  ros__parameters:
    left_input_topic: '/oak/left/camera_info'
    right_input_topic: '/oak/right/camera_info'
    left_output_topic: '/vslam/left/camera_info'
    right_output_topic: '/vslam/right/camera_info'
