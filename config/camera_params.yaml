/oak:
  ros__parameters:
    # NOTE: depthai_ros_driver params are namespaced per node
    # (camera / rgb / stereo / left / right). Flat names like
    # "i_rgb_fps" under camera: are silently ignored by the driver.
    camera:
      i_nn_type: none
      i_pipeline_type: RGBD
      i_enable_imu: true
      i_enable_sync: true        # Hardware-sync RGB + depth timestamps

    rgb:
      i_resolution: '720'
      i_fps: 30.0                # Must match stereo fps for sync to work
      i_max_q_size: 2

    stereo:
      i_fps: 30.0
      i_align_depth: true        # Depth registered to the RGB frame (required by rtabmap RGBD)
      i_depth_preset: HIGH_ACCURACY  # Runs on-device, costs no Jetson CPU
      i_max_q_size: 2
